### Vincent Debian 13 appliance installer.
### Disk partitioning remains in the normal Debian installer workflow.

d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
### Network interface selection remains interactive so Wi-Fi can use Debian's
### standard SSID/password workflow when wired networking is unavailable.
### DNS normally follows the selected network's DHCP/manual configuration.
d-i netcfg/get_hostname string vincent-worker
d-i netcfg/get_domain string local
d-i hw-detect/load_firmware boolean true

### Vincent installation must not depend on an Internet package mirror. The
### Debian base system comes from the verified installer medium and Vincent's
### required bootstrap/tooling package closure is embedded in the image. This
### avoids installation failure on networks that transparently TLS-inspect or
### redirect Debian mirrors. Normal signed Debian HTTPS repositories are
### configured in the installed system for first boot and later maintenance.
d-i apt-setup/use_mirror boolean false
d-i apt-setup/cdrom/set-first boolean true
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false

d-i clock-setup/utc boolean true
d-i time/zone string America/Sitka
d-i clock-setup/ntp boolean true

### Vincent has no conventional human login account. Debian Installer can force
### make-user=true when root-login=false, so satisfy its account state machine
### with an unusable root hash, suppress human-account creation, then lock root
### again in late_command before first boot.
d-i passwd/root-login boolean true
d-i passwd/root-password-crypted password !vincent-installer-no-login!
d-i passwd/make-user boolean false

### Do not preseed partitioning choices. ADR-0003 requires the normal Debian
### disk-partitioning workflow. ADR-0004 only excludes the active installer
### medium from disk enumeration; it must not select another disk.
### Immediately before partman, capture resolver/routing/endpoint evidence into
### installer syslog (visible on Alt+F4), then exclude the active installer disk.
d-i partman/early_command string sh /cdrom/vincent/installer-network-preflight.sh; sh /cdrom/vincent/installer-media-guard.sh

### Do not run network-backed tasksel/pkgsel during Debian installation. The
### exact bootstrap package closure is installed from /cdrom/vincent instead.
d-i pkgsel/run_tasksel boolean false
d-i pkgsel/include string
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false

d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true

d-i preseed/late_command string \
    mkdir -p /target/opt/vincent-installer /target/var/log/vincent /target/var/lib/vincent-install /target/opt/vincent-installer/offline-debs /target/etc/apt/sources.list.d; \
    cp /cdrom/vincent/expected-commit /target/opt/vincent-installer/expected-commit; \
    cp /cdrom/vincent/platform.tar.gz /target/opt/vincent-installer/platform.tar.gz; \
    cp /cdrom/vincent/payload-manifest.json /target/opt/vincent-installer/payload-manifest.json; \
    cp /cdrom/vincent/payload.py /target/opt/vincent-installer/payload.py; \
    cp /cdrom/vincent/build-number /target/opt/vincent-installer/build-number; \
    cp /cdrom/vincent/offline-packages.tar.gz /target/opt/vincent-installer/offline-packages.tar.gz; \
    cp /cdrom/vincent/offline-packages.manifest /target/opt/vincent-installer/offline-packages.manifest; \
    cp /cdrom/vincent/runtime-debian.sources /target/etc/apt/sources.list.d/debian.sources; \
    rm -f /target/etc/apt/sources.list; \
    tar -xzf /target/opt/vincent-installer/offline-packages.tar.gz -C /target/opt/vincent-installer/offline-debs; \
    in-target sh -c 'apt-get -y --no-install-recommends install /opt/vincent-installer/offline-debs/*.deb'; \
    rm -rf /target/opt/vincent-installer/offline-debs; \
    cp /cdrom/vincent/first-boot.sh /target/usr/local/sbin/vincent-first-boot; \
    cp /cdrom/vincent/self-test.sh /target/usr/local/sbin/vincent-self-test; \
    cp /cdrom/vincent/console-status.sh /target/usr/local/sbin/vincent-console-status; \
    cp /cdrom/vincent/codex-console.sh /target/usr/local/sbin/vincent-codex-console; \
    cp /cdrom/vincent/network-console.sh /target/usr/local/sbin/vincent-network-console; \
    cp /cdrom/vincent/network-diagnostics.sh /target/usr/local/sbin/vincent-network-diagnostics; \
    cp /cdrom/vincent/diagnostics.sh /target/usr/local/sbin/vincent-diagnostics; \
    cp /cdrom/vincent/diagnostics-console.sh /target/usr/local/sbin/vincent-diagnostics-console; \
    cp /cdrom/vincent/vincent-first-boot.service /target/etc/systemd/system/vincent-first-boot.service; \
    cp /cdrom/vincent/vincent-console-status.service /target/etc/systemd/system/vincent-console-status.service; \
    cp /cdrom/vincent/vincent-codex-console.service /target/etc/systemd/system/vincent-codex-console.service; \
    cp /cdrom/vincent/vincent-network-console.service /target/etc/systemd/system/vincent-network-console.service; \
    cp /cdrom/vincent/vincent-diagnostics.service /target/etc/systemd/system/vincent-diagnostics.service; \
    cp /cdrom/vincent/vincent-diagnostics.timer /target/etc/systemd/system/vincent-diagnostics.timer; \
    cp /cdrom/vincent/vincent-diagnostics-console.service /target/etc/systemd/system/vincent-diagnostics-console.service; \
    chmod 0755 /target/usr/local/sbin/vincent-first-boot /target/usr/local/sbin/vincent-self-test /target/usr/local/sbin/vincent-console-status /target/usr/local/sbin/vincent-codex-console /target/usr/local/sbin/vincent-network-console /target/usr/local/sbin/vincent-network-diagnostics /target/usr/local/sbin/vincent-diagnostics /target/usr/local/sbin/vincent-diagnostics-console; \
    chmod 0644 /target/opt/vincent-installer/expected-commit /target/opt/vincent-installer/build-number /target/opt/vincent-installer/offline-packages.tar.gz /target/opt/vincent-installer/offline-packages.manifest /target/etc/apt/sources.list.d/debian.sources; \
    in-target passwd -l root; \
    in-target systemctl mask getty@tty1.service getty@tty2.service getty@tty3.service getty@tty4.service; \
    in-target systemctl enable NetworkManager.service ssh.service vincent-first-boot.service vincent-console-status.service vincent-codex-console.service vincent-network-console.service vincent-diagnostics.timer vincent-diagnostics-console.service

d-i finish-install/reboot_in_progress note
