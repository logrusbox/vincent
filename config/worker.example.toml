[worker]
id = "worker-example-01"
poll_seconds = 60
capabilities = ["git", "python"]

[paths]
state_file = "/var/lib/vincent/worker-state.json"
workspace_root = "/srv/codex/worktrees"
identity_file = "/var/lib/vincent/identity/identity.json"

[coordination]
checkout = "/srv/codex/platform"
branch = "main"
tasks_path = "coordination/tasks"

[git]
author_name = "Mission Control Worker"
author_email = "worker@localhost.invalid"

[provider]
# Operator-selected maximum duration for each provider invocation.
# Required before serve; select this for the work rather than copying blindly.
execution_timeout_seconds = 900

[authorization]
# Select an explicit mode and exact repositories before enabling execution.
mode = "standalone"
repositories = []
# Managed mode instead requires a root-installed, expiring grant:
# mode = "managed"
# grant_path = "/etc/vincent/authorization.json"
